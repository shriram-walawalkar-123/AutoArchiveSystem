services:
  postgres:
    image: postgres:15
    container_name: autoarchive-postgres
    environment:
      POSTGRES_DB: autoarchive
      POSTGRES_USER: autoarchive
      POSTGRES_PASSWORD: autoarchive
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: autoarchive-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
