spring:
  application:
    name: autoarchive
  datasource:
    url: jdbc:postgresql://localhost:5433/autoarchive?options=-c%20TimeZone%3DUTC
    username: autoarchive
    password: autoarchive
  flyway:
    enabled: true

autoarchive:
  storage:
    type: local
    scan-roots:
      - C:/Users/swala/Desktop/AutoArchiveSystem/data/active
    archive-root: C:/Users/swala/Desktop/AutoArchiveSystem/data/archive

  retention:
    archive-after-days: 0
    dry-run: false

  archive:
    mode: sequential
    parallel-concurrency: 8

  audit:
    file-path: C:/Users/swala/Desktop/AutoArchiveSystem/data/audit/audit.log
    db-batch-size: 100
    file-batch-size: 100
    file-enabled: true
    db-enabled: true

  redis:
    host: localhost
    port: 6379